<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/logo image.jpg" />
    <link rel="apple-touch-icon" href="/images/logo image.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANIMEX Animal Health Care Private Limited | Veterinary Healthcare & Animal Feed Supplements</title>
    <meta name="description" content="Animex Animal Health Care Private Limited is a leading manufacturer of premium veterinary health products, mineral mixtures, calcium supplements, liver tonics, and feed supplements for Cattle, Buffalo, Goat, Sheep, Poultry & Pets." />
    <meta name="keywords" content="Veterinary Medicine, Animal Feed Supplements, Calcium Supplement, Mineral Mixture, Liver Tonic, Cattle Healthcare, Poultry Nutrition, Animex Animal Health" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Google Universal Translate Engine for 100% A-Z Full Page Translation -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,mr,gu,pa,kn,ta,te,bn,ml',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
      /* Clean styling: Hide top Google Translate banner frame */
      .goog-te-banner-frame, iframe.skiptranslate {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      #google_translate_element {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 0;
        height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-animex-orange-500 selection:text-white transition-colors duration-300">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
